// Demo copy only: massless, EC-free kOS processors in the upper stage's Mk1 pod and the booster's
// RC-001S, both booting /boot/demo.ks (which picks the script by part).
@PART[mk1pod_v2]:NEEDS[kOS]
{
	MODULE
	{
		name = kOSProcessor
		diskSpace = 200000
		baseDiskSpace = 200000
		diskSpaceMassFactor = 0
		diskSpaceCostFactor = 0
		baseModuleMass = 0
		ECPerBytePerSecond = 0
		ECPerInstruction = 0
		bootFile = /boot/demo.ks
	}
}
@PART[probeStackSmall]:NEEDS[kOS]
{
	MODULE
	{
		name = kOSProcessor
		diskSpace = 200000
		baseDiskSpace = 200000
		diskSpaceMassFactor = 0
		diskSpaceCostFactor = 0
		baseModuleMass = 0
		ECPerBytePerSecond = 0
		ECPerInstruction = 0
		bootFile = /boot/demo.ks
	}
}
