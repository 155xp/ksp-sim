// Harness copy only: a massless, EC-free kOS processor inside the stock Mk1 pod so stock crafts
// can be flown by script without adding a part.
@PART[mk1pod_v2]:NEEDS[kOS]
{
	MODULE
	{
		name = kOSProcessor
		diskSpace = 100000
		baseDiskSpace = 100000
		diskSpaceMassFactor = 0
		diskSpaceCostFactor = 0
		baseModuleMass = 0
		ECPerBytePerSecond = 0
		ECPerInstruction = 0
		bootFile = /boot/harness.ks
	}
}
